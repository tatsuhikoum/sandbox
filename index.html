<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>机上</title>
    <meta
      name="description"
      content="今日の焦点と、集中する時間を一つの画面に置く。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c1814'/%3E%3Crect x='7' y='21' width='18' height='2.5' fill='%23f3ecdf'/%3E%3Cpath d='M10 18V11h8v7' fill='none' stroke='%23f3ecdf' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="mast">
        <div class="brand">
          <p class="kicker">Tokyo</p>
          <h1>机上</h1>
          <p class="lede">今日の焦点と、集中する時間を一つの画面に置く。</p>
        </div>
        <div class="now">
          <p class="clock" aria-hidden="true">
            <span id="clock-hm">--:--</span><span id="clock-s">--</span>
          </p>
          <p id="date-line" class="date-line">日付を読み込み中</p>
          <p class="tz">アジア/東京</p>
        </div>
      </header>

      <main>
        <section class="timer-panel" aria-labelledby="timer-heading">
          <div class="panel-kicker">
            <h2 id="timer-heading">集中</h2>
            <p id="timer-status" aria-live="polite">待機中</p>
          </div>
          <p id="timer-display" class="timer-display" aria-live="off">25:00</p>
          <p id="timer-done" class="timer-done" hidden>区切りです</p>
          <div class="timer-actions">
            <button type="button" id="timer-toggle" class="btn btn-primary">
              始める
            </button>
            <button type="button" id="timer-reset" class="btn btn-quiet" hidden>
              最初に戻す
            </button>
          </div>
          <div id="timer-done-actions" class="timer-actions" hidden>
            <button type="button" id="break-button" class="btn btn-primary">
              5分休む
            </button>
            <button type="button" id="again-button" class="btn btn-quiet">
              もう一度
            </button>
          </div>
          <div class="presets" role="group" aria-label="分数のプリセット">
            <button type="button" class="preset" data-preset="25" aria-pressed="true">
              25分
            </button>
            <button type="button" class="preset" data-preset="5" aria-pressed="false">
              5分
            </button>
            <button type="button" class="preset" data-preset="15" aria-pressed="false">
              15分
            </button>
          </div>
          <form id="custom-form" class="custom-form">
            <label for="custom-minutes">分数</label>
            <input
              id="custom-minutes"
              name="minutes"
              type="number"
              inputmode="numeric"
              value="25"
            />
            <button type="submit" class="btn btn-quiet" id="custom-apply">
              この分数にする
            </button>
          </form>
          <p id="timer-message" class="form-message" role="status"></p>
        </section>

        <div class="work">
          <p id="sample-banner" class="sample-banner">
            <strong>サンプル</strong>
            <span>書き換えると、このブラウザの中に残ります。</span>
          </p>

          <section class="block" aria-labelledby="focus-heading">
            <div class="block-head">
              <h2 id="focus-heading">今日の焦点</h2>
              <p id="progress-text" class="progress-text"></p>
            </div>
            <div
              id="meter"
              class="meter"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="0"
              aria-valuenow="0"
              aria-labelledby="focus-heading"
              hidden
            >
              <div id="meter-bar" class="meter-bar"></div>
            </div>
            <ul id="focus-list" class="focus-list"></ul>
            <p id="empty-focus" class="empty" hidden>
              焦点を一つ置くと、進みが見えます。
            </p>
            <form id="add-form" class="add-form">
              <label class="sr" for="add-input">焦点を書く</label>
              <input
                id="add-input"
                name="text"
                type="text"
                maxlength="80"
                placeholder="焦点を書く"
                autocomplete="off"
              />
              <button type="submit" class="btn btn-primary">加える</button>
            </form>
            <p id="list-message" class="form-message" role="status"></p>
          </section>

          <section class="block" aria-labelledby="note-heading">
            <h2 id="note-heading">メモ</h2>
            <label class="sr" for="note">メモ</label>
            <textarea
              id="note"
              maxlength="2000"
              rows="6"
              placeholder="残しておきたいことを書く"
            ></textarea>
          </section>

          <div class="danger-zone">
            <div id="clear-confirm" class="confirm" hidden>
              <p>焦点とメモを消します。</p>
              <button type="button" id="clear-do" class="btn btn-primary">
                消す
              </button>
              <button type="button" id="clear-cancel" class="btn btn-quiet">
                やめる
              </button>
            </div>
            <div id="sample-confirm" class="confirm" hidden>
              <p>今の焦点とメモを、サンプルで置き換えます。</p>
              <button type="button" id="sample-do" class="btn btn-primary">
                読み込む
              </button>
              <button type="button" id="sample-cancel" class="btn btn-quiet">
                やめる
              </button>
            </div>
            <div class="quiet-actions">
              <button type="button" id="clear-start" class="text-btn">
                今日の内容を消す
              </button>
              <button type="button" id="sample-start" class="text-btn">
                サンプルを読み込む
              </button>
            </div>
          </div>
        </div>
      </main>

      <footer class="colophon">
        <p>このブラウザの中だけに保存します。サーバーには送りません。</p>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
